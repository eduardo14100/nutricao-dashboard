<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Sem conexão — Painel Nutricional</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; padding: 24px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 28px; max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 18px; margin: 16px 0 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #10b981; color: #052e16; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>Você está sem internet</h1>
    <p>O painel precisa de conexão para carregar e salvar seus dados com segurança. Assim que a internet voltar, toque em tentar novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
